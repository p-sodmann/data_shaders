[project]
name = "mars-demo"
version = "0.1.0"
description = "Demo FastAPI service and load generator for MARS"
requires-python = ">=3.11"
dependencies = [
    "mars-probe",
    "fastapi",
    "uvicorn",
    "httpx",
]

[dependency-groups]
dev = [
    # TestClient's HTTP backend (starlette 1.10 deprecates plain httpx there); the loadgen
    # keeps using httpx as its client
    "httpx2",
    "pytest",
    "ruff",
]

[tool.uv.sources]
mars-probe = { path = "../../probe", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
