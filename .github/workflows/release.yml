# On a v* tag: the multi-arch images (amd64, arm64 for Raspberry Pi) to GHCR, tagged with the
# version and latest, and the probe wheel and sdist as release assets. The tag must match
# probe/src/mars_probe/_version.py (scripts/version.sh).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(scripts/version.sh)"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/p-sodmann/mars-web:${{ github.ref_name }}
            ghcr.io/p-sodmann/mars-web:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/p-sodmann/mars-demo:${{ github.ref_name }}
            ghcr.io/p-sodmann/mars-demo:latest
      - uses: astral-sh/setup-uv@v6
      - run: uv build
        working-directory: probe
      - name: GitHub release with this version's CHANGELOG section
        run: |
          awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0, v) == 1 {p = 1; next} /^## \[/ {p = 0} p' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md probe/dist/*
        env:
          GH_TOKEN: ${{ github.token }}
