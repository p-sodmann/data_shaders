# Every check in the repo (scripts/check.sh), then the demo stack under real Docker Compose.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Chromium's system libraries for the smoke test; check.sh installs the browser itself.
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: scripts/check.sh

  stack:
    # The demo stack must come up healthy and the recording rules must have data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml --profile demo up -d --build --wait --wait-timeout 180
      - name: mars:throughput_rps through the MARS proxy, for a service and the agent's host
        run: |
          for i in $(seq 30); do
            out=$(curl -s localhost:8080/prom/api/v1/query --data-urlencode 'query=mars:throughput_rps')
            echo "$out" | grep -q '"station":"api"' && echo "$out" | grep -q '"station":"fleet"' \
              && echo "$out" && exit 0
            sleep 2
          done
          echo "$out"; exit 1
      - name: a key made at /api/keys takes a push, and the node shows up
        run: |
          token=$(curl -sf -X POST localhost:8080/api/keys -H 'Content-Type: application/json' \
            -d '{"name": "ci", "station": "ci"}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          for i in $(seq 15); do
            printf 'mars_info{version="ci"} 1\n' | curl -sf -X POST --data-binary @- \
              -H "Authorization: Bearer $token" localhost:8080/push/ci-1
            out=$(curl -s localhost:8080/prom/api/v1/query --data-urlencode 'query=mars:node_up{station="ci"}')
            echo "$out" | grep -q '"instance":"ci-1"' && echo "$out" && exit 0
            sleep 1
          done
          echo "$out"; exit 1
      - if: failure()
        run: docker compose -f deploy/compose.yaml --profile demo logs --tail 50
      - run: docker compose -f deploy/compose.yaml --profile demo down -v
