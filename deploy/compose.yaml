# MARS stack (ADR-0004).
#   docker compose -f deploy/compose.yaml up -d                     # MARS + gateway + Prometheus
#   docker compose -f deploy/compose.yaml --profile demo up -d      # + demo stations, loadgen
# MARS: http://localhost:8080 · Prometheus: http://localhost:9090 (this machine only)
# The demo stations push to MARS (ADR-0010) with keys from MARS_PUSH_KEYS below.
name: mars

# One image for both demo stations and the loadgen. Each service carries the same build so any
# of them can be started alone; the build is cached after the first.
x-demo: &demo
  profiles: [demo]
  build:
    context: ..
    dockerfile: examples/demo/Dockerfile
  image: mars-demo:local
  restart: unless-stopped

x-demo-station: &demo-station
  <<: *demo
  depends_on:
    - mars
  healthcheck:
    # The image has no curl. /healthz isn't timed by the probe, so this adds no series.
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  mars:
    build: ../web
    image: mars-web:local
    ports:
      - "8080:8080"
    environment:
      PROMETHEUS_URL: prometheus:9090
      # '<user> <bcrypt hash>' turns on basic auth (deploy/README.md#security). Unset: none.
      MARS_BASIC_AUTH: ${MARS_BASIC_AUTH:-}
    volumes:
      # Config documents, served at /config/ (step 06). May stay empty.
      - ./config:/config:ro
    depends_on:
      - prometheus
      - mars-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Takes pushes from mars-agent and mars-probe (ADR-0010); Caddy forwards /push and /api/keys.
  mars-gateway:
    build: ../gateway
    image: mars-gateway:local
    environment:
      # Keys for the demo clients, one per station. Keys made on the display (E → Keys) are
      # kept in the gateway-data volume.
      MARS_PUSH_KEYS: api:demo-api-key search:demo-search-key fleet:demo-fleet-key
    ports:
      # For `npm run dev`, which proxies /api/keys and /push to localhost:9111.
      - "127.0.0.1:9111:9111"
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9111/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    ports:
      # Prometheus has no auth, so it is only published on loopback (for `npm run dev`, which
      # proxies /prom to localhost:9090). MARS reaches it over the compose network.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      # The recording rules, straight from the probe package (the only copy, ADR-0003).
      - ../probe/src/mars_probe/prometheus:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  demo-api:
    <<: *demo-station
    environment:
      MARS_STATION: api
      MARS_PUSH_URL: http://mars:8080
      MARS_PUSH_KEY: demo-api-key
      MARS_INSTANCE: demo-api

  demo-search:
    <<: *demo-station
    environment:
      MARS_STATION: search
      MARS_PUSH_URL: http://mars:8080
      MARS_PUSH_KEY: demo-search-key
      MARS_INSTANCE: demo-search
      # A slower station, so the two read differently on the display.
      DEMO_LATENCY_SCALE: "1.6"

  # A Linux host as station `fleet` (agent/, ADR-0009): the Docker or Podman VM, seen from a
  # container. Open http://localhost:8080/?config=/examples/linux-fleet.json to watch it.
  demo-host:
    profiles: [demo]
    build: ../agent
    image: mars-agent:local
    environment:
      MARS_PUSH_URL: http://mars:8080
      MARS_PUSH_KEY: demo-fleet-key
      MARS_INSTANCE: demo-host
    depends_on:
      - mars
    healthcheck:
      test: ["CMD", "python", "-m", "mars_agent", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  loadgen:
    <<: *demo
    command: ["python", "-m", "demo.loadgen"]
    environment:
      LOADGEN_TARGETS: http://demo-api:8000,http://demo-search:8000
      # A compressed 10-minute day, so a demo shows the daily swing.
      LOADGEN_DAY_SECONDS: "600"
    depends_on:
      demo-api:
        condition: service_healthy
      demo-search:
        condition: service_healthy

volumes:
  prometheus-data:
  gateway-data:
