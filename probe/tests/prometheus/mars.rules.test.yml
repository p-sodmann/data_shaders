# promtool unit tests for the MARS recording rules (ADR-0003).
#   promtool test rules probe/tests/prometheus/mars.rules.test.yml
#   bash probe/scripts/test-rules.sh          # same, inside the prom/prometheus image
#
# Counters grow linearly at 1 s steps, so every rate is exact: `0+9x30` is 9 per second.
# Histograms only carry the buckets a case needs; histogram_quantile interpolates linearly
# inside a bucket, so everything in (0.005, 0.01] at rank 50 % gives 7.5 ms.
rule_files:
  - ../../src/mars_probe/prometheus/mars.rules.yml

evaluation_interval: 1s
fuzzy_compare: true

tests:
  # ── normal traffic: 9 rps OK in FRA, 1 rps 5xx with no region, two stages ───────────────
  - name: normal traffic
    interval: 1s
    input_series:
      - series: 'mars_info{job="mars", instance="api:8000", station="api", version="0.1.0"}'
        values: '1x30'
      - series: 'up{job="mars", instance="api:8000"}'
        values: '1x30'
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="2xx", region="FRA", le="0.005"}'
        values: '0x30'
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="2xx", region="FRA", le="0.01"}'
        values: '0+9x30'
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="2xx", region="FRA", le="+Inf"}'
        values: '0+9x30'
      - series: 'mars_http_request_duration_seconds_count{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="2xx", region="FRA"}'
        values: '0+9x30'
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="5xx", region="unknown", le="0.005"}'
        values: '0x30'
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="5xx", region="unknown", le="0.01"}'
        values: '0+1x30'
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="5xx", region="unknown", le="+Inf"}'
        values: '0+1x30'
      - series: 'mars_http_request_duration_seconds_count{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="5xx", region="unknown"}'
        values: '0+1x30'
      # Client RTT (step 11): 8 per second at 62.5 ms in FRA; the unknown region is left out.
      - series: 'mars_client_rtt_seconds_sum{job="mars", instance="api:8000", station="api", region="FRA"}'
        values: '0+0.5x30'
      - series: 'mars_client_rtt_seconds_count{job="mars", instance="api:8000", station="api", region="FRA"}'
        values: '0+8x30'
      - series: 'mars_client_rtt_seconds_sum{job="mars", instance="api:8000", station="api", region="unknown"}'
        values: '0+1x30'
      - series: 'mars_client_rtt_seconds_count{job="mars", instance="api:8000", station="api", region="unknown"}'
        values: '0+1x30'
      - series: 'mars_stage_duration_seconds_sum{job="mars", instance="api:8000", station="api", stage="infer"}'
        values: '0+0.25x30'
      - series: 'mars_stage_duration_seconds_count{job="mars", instance="api:8000", station="api", stage="infer"}'
        values: '0+8x30'
      - series: 'mars_stage_duration_seconds_sum{job="mars", instance="api:8000", station="api", stage="auth"}'
        values: '0+0.0625x30'
      - series: 'mars_stage_duration_seconds_count{job="mars", instance="api:8000", station="api", stage="auth"}'
        values: '0+16x30'
      - series: 'mars_process_cpu_seconds_total{job="mars", instance="api:8000", station="api"}'
        values: '0+0.25x30'
      - series: 'mars_http_requests_in_flight{job="mars", instance="api:8000", station="api"}'
        values: '8x30'
      - series: 'mars_http_requests_in_flight_limit{job="mars", instance="api:8000", station="api"}'
        values: '64x30'
    promql_expr_test:
      - expr: mars:throughput_rps
        eval_time: 20s
        exp_samples:
          - labels: 'mars:throughput_rps{station="api"}'
            value: 10
      - expr: mars:latency_p50_ms
        eval_time: 20s
        exp_samples:
          - labels: 'mars:latency_p50_ms{station="api"}'
            value: 7.5
      - expr: mars:error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:error_ratio{station="api"}'
            value: 0.1
      - expr: mars:error_ratio:rate1m
        eval_time: 20s
        exp_samples:
          - labels: 'mars:error_ratio:rate1m{station="api"}'
            value: 0.1
      - expr: mars:node_up
        eval_time: 20s
        exp_samples:
          - labels: 'mars:node_up{station="api", instance="api:8000"}'
            value: 1
      - expr: mars:node_load_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:node_load_ratio{station="api", instance="api:8000"}'
            value: 0.25
      - expr: mars:node_latency_p50_ms
        eval_time: 20s
        exp_samples:
          - labels: 'mars:node_latency_p50_ms{station="api", instance="api:8000"}'
            value: 7.5
      # In-flight 8/64 = 0.125 is below the CPU load, so CPU decides.
      - expr: mars:saturation_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:saturation_ratio{station="api"}'
            value: 0.25
      # Per route: P95 is rank 9.5 of 10 inside (0.005, 0.01].
      - expr: mars:endpoint_rps
        eval_time: 20s
        exp_samples:
          - labels: 'mars:endpoint_rps{station="api", route="/v1/predict"}'
            value: 10
      - expr: mars:endpoint_p95_ms
        eval_time: 20s
        exp_samples:
          - labels: 'mars:endpoint_p95_ms{station="api", route="/v1/predict"}'
            value: 9.75
      - expr: mars:endpoint_error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:endpoint_error_ratio{station="api", route="/v1/predict"}'
            value: 0.1
      # Per stage: 0.25 s over 8 calls, 0.0625 s over 16 calls (binary-exact, no float noise).
      - expr: mars:stage_mean_ms
        eval_time: 20s
        exp_samples:
          - labels: 'mars:stage_mean_ms{station="api", stage="infer"}'
            value: 31.25
          - labels: 'mars:stage_mean_ms{station="api", stage="auth"}'
            value: 3.90625
      # Per region: the 5xx were region "unknown", which is left out, so FRA has 0 errors.
      - expr: mars:region_rps
        eval_time: 20s
        exp_samples:
          - labels: 'mars:region_rps{station="api", region="FRA"}'
            value: 9
      - expr: mars:region_error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:region_error_ratio{station="api", region="FRA"}'
            value: 0
      - expr: mars:region_rtt_ms
        eval_time: 20s
        exp_samples:
          - labels: 'mars:region_rtt_ms{station="api", region="FRA"}'
            value: 62.5

  # ── zero errors: traffic, but no 5xx series at all → 0, not absent ──────────────────────
  - name: zero errors
    interval: 1s
    input_series:
      - series: 'mars_http_request_duration_seconds_count{job="mars", instance="search:8000", station="search", route="/v1/rank", method="POST", code_class="2xx", region="unknown"}'
        values: '0+5x30'
      - series: 'mars_http_request_duration_seconds_count{job="mars", instance="search:8000", station="search", route="/v1/items/{item_id}", method="GET", code_class="4xx", region="unknown"}'
        values: '0+1x30'
    promql_expr_test:
      - expr: mars:error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:error_ratio{station="search"}'
            value: 0
      # 4xx is not an error.
      - expr: mars:endpoint_error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:endpoint_error_ratio{station="search", route="/v1/rank"}'
            value: 0
          - labels: 'mars:endpoint_error_ratio{station="search", route="/v1/items/{item_id}"}'
            value: 0

  # ── all errors ──────────────────────────────────────────────────────────────────────────
  - name: all errors
    interval: 1s
    input_series:
      - series: 'mars_http_request_duration_seconds_count{job="mars", instance="api:8000", station="api", route="/v1/embed", method="POST", code_class="5xx", region="FRA"}'
        values: '0+4x30'
    promql_expr_test:
      - expr: mars:error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:error_ratio{station="api"}'
            value: 1
      - expr: mars:endpoint_error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:endpoint_error_ratio{station="api", route="/v1/embed"}'
            value: 1
      - expr: mars:region_error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:region_error_ratio{station="api", region="FRA"}'
            value: 1

  # ── no traffic: counters exist but don't move ───────────────────────────────────────────
  - name: no traffic
    interval: 1s
    input_series:
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="2xx", region="FRA", le="0.01"}'
        values: '100x30'
      - series: 'mars_http_request_duration_seconds_bucket{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="2xx", region="FRA", le="+Inf"}'
        values: '100x30'
      - series: 'mars_http_request_duration_seconds_count{job="mars", instance="api:8000", station="api", route="/v1/predict", method="POST", code_class="2xx", region="FRA"}'
        values: '100x30'
      - series: 'mars_stage_duration_seconds_sum{job="mars", instance="api:8000", station="api", stage="infer"}'
        values: '1x30'
      - series: 'mars_stage_duration_seconds_count{job="mars", instance="api:8000", station="api", stage="infer"}'
        values: '100x30'
    promql_expr_test:
      # Throughput is a real 0 ...
      - expr: mars:throughput_rps
        eval_time: 20s
        exp_samples:
          - labels: 'mars:throughput_rps{station="api"}'
            value: 0
      - expr: mars:endpoint_rps
        eval_time: 20s
        exp_samples:
          - labels: 'mars:endpoint_rps{station="api", route="/v1/predict"}'
            value: 0
      - expr: mars:region_rps
        eval_time: 20s
        exp_samples:
          - labels: 'mars:region_rps{station="api", region="FRA"}'
            value: 0
      # ... while latencies and ratios are absent rather than NaN.
      - expr: mars:latency_p50_ms
        eval_time: 20s
        exp_samples: []
      - expr: mars:node_latency_p50_ms
        eval_time: 20s
        exp_samples: []
      - expr: mars:error_ratio
        eval_time: 20s
        exp_samples: []
      - expr: mars:endpoint_p95_ms
        eval_time: 20s
        exp_samples: []
      - expr: mars:endpoint_error_ratio
        eval_time: 20s
        exp_samples: []
      - expr: mars:region_error_ratio
        eval_time: 20s
        exp_samples: []
      - expr: mars:stage_mean_ms
        eval_time: 20s
        exp_samples: []

  # ── a node goes down: node_up reads 0 instead of vanishing ──────────────────────────────
  # api-1 dies after 10 s (its series go stale, `up` drops to 0). api-2 is restarted with a
  # new version at 10 s, so for an hour it has two mars_info series; it must still read 1.
  - name: node down
    interval: 1s
    input_series:
      - series: 'up{job="mars", instance="api-1:8000"}'
        values: '1x10 0x20'
      - series: 'mars_info{job="mars", instance="api-1:8000", station="api", version="0.1.0"}'
        values: '1x10 stale'
      - series: 'up{job="mars", instance="api-2:8000"}'
        values: '1x30'
      - series: 'mars_info{job="mars", instance="api-2:8000", station="api", version="0.1.0"}'
        values: '1x10 stale'
      - series: 'mars_info{job="mars", instance="api-2:8000", station="api", version="0.2.0"}'
        values: '_x10 1x20'
    promql_expr_test:
      - expr: mars:node_up
        eval_time: 5s
        exp_samples:
          - labels: 'mars:node_up{station="api", instance="api-1:8000"}'
            value: 1
          - labels: 'mars:node_up{station="api", instance="api-2:8000"}'
            value: 1
      - expr: mars:node_up
        eval_time: 25s
        exp_samples:
          - labels: 'mars:node_up{station="api", instance="api-1:8000"}'
            value: 0
          - labels: 'mars:node_up{station="api", instance="api-2:8000"}'
            value: 1

  # ── saturation with and without an in-flight limit ──────────────────────────────────────
  # sat-limit: in-flight 48/64 = 0.75 beats CPU 0.25.
  # sat-nolimit: limit 0 (unset), so only CPU 0.25 counts even with 48 in flight.
  # sat-hot: two nodes, the busier one decides; CPU 1.5 cores clamps to 1.
  - name: saturation
    interval: 1s
    input_series:
      - series: 'mars_http_requests_in_flight{job="mars", instance="a:8000", station="sat-limit"}'
        values: '48x30'
      - series: 'mars_http_requests_in_flight_limit{job="mars", instance="a:8000", station="sat-limit"}'
        values: '64x30'
      - series: 'mars_process_cpu_seconds_total{job="mars", instance="a:8000", station="sat-limit"}'
        values: '0+0.25x30'
      - series: 'mars_http_requests_in_flight{job="mars", instance="b:8000", station="sat-nolimit"}'
        values: '48x30'
      - series: 'mars_http_requests_in_flight_limit{job="mars", instance="b:8000", station="sat-nolimit"}'
        values: '0x30'
      - series: 'mars_process_cpu_seconds_total{job="mars", instance="b:8000", station="sat-nolimit"}'
        values: '0+0.25x30'
      - series: 'mars_process_cpu_seconds_total{job="mars", instance="c1:8000", station="sat-hot"}'
        values: '0+0.5x30'
      - series: 'mars_process_cpu_seconds_total{job="mars", instance="c2:8000", station="sat-hot"}'
        values: '0+1.5x30'
    promql_expr_test:
      - expr: mars:saturation_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:saturation_ratio{station="sat-limit"}'
            value: 0.75
          - labels: 'mars:saturation_ratio{station="sat-nolimit"}'
            value: 0.25
          - labels: 'mars:saturation_ratio{station="sat-hot"}'
            value: 1
      - expr: mars:node_load_ratio{station="sat-hot"}
        eval_time: 20s
        exp_samples:
          - labels: 'mars:node_load_ratio{station="sat-hot", instance="c1:8000"}'
            value: 0.5
          - labels: 'mars:node_load_ratio{station="sat-hot", instance="c2:8000"}'
            value: 1

  # ── hosts (mars-agent, ADR-0009): two hosts of station `fleet`, next to a service ───────
  # h1: 4 CPUs at 2 busy s/s = 0.5, memory 0.25, disk 30/(30+70) = 0.3 → load 0.5 (cpu).
  # h2: 2 CPUs at 0.4 busy s/s = 0.2, memory 0.75, disk 90/(90+10) = 0.9 → load 0.9 (disk).
  # Run-queue wait: h1 0.5 s over 1024 slices = 0.48828125 ms, h2 1.5 s over 512 = 2.9296875 ms,
  # fleet 2 s over 1536 = 1.302 ms (powers of two, so the floats come out exact). Packets 150 +
  # 50 per second. Memory stall 0.125 and 0.0625 → 0.09375; the [1m] rule is read at 80 s,
  # once a whole minute of data is there (rate extrapolates only part way into an empty window).
  # `svc` has only service series: none of the host rules may record anything for it.
  - name: hosts
    interval: 1s
    input_series:
      - series: 'mars_info{job="mars", instance="h1:9110", station="fleet", version="0.1.0"}'
        values: '1x30'
      - series: 'up{job="mars", instance="h1:9110"}'
        values: '1x30'
      - series: 'mars_host_cpus{job="mars", instance="h1:9110", station="fleet"}'
        values: '4x30'
      - series: 'mars_host_cpu_busy_seconds_total{job="mars", instance="h1:9110", station="fleet"}'
        values: '0+2x30'
      - series: 'mars_host_memory_total_bytes{job="mars", instance="h1:9110", station="fleet"}'
        values: '8000x30'
      - series: 'mars_host_memory_available_bytes{job="mars", instance="h1:9110", station="fleet"}'
        values: '6000x30'
      - series: 'mars_host_filesystem_used_bytes{job="mars", instance="h1:9110", station="fleet"}'
        values: '30x30'
      - series: 'mars_host_filesystem_avail_bytes{job="mars", instance="h1:9110", station="fleet"}'
        values: '70x30'
      - series: 'mars_host_runqueue_wait_seconds_total{job="mars", instance="h1:9110", station="fleet"}'
        values: '0+0.5x30'
      - series: 'mars_host_timeslices_total{job="mars", instance="h1:9110", station="fleet"}'
        values: '0+1024x30'
      - series: 'mars_host_network_packets_total{job="mars", instance="h1:9110", station="fleet", direction="rx"}'
        values: '0+100x30'
      - series: 'mars_host_network_packets_total{job="mars", instance="h1:9110", station="fleet", direction="tx"}'
        values: '0+50x30'
      - series: 'mars_host_memory_stall_seconds_total{job="mars", instance="h1:9110", station="fleet"}'
        values: '0+0.125x90'
      - series: 'mars_info{job="mars", instance="h2:9110", station="fleet", version="0.1.0"}'
        values: '1x30'
      - series: 'up{job="mars", instance="h2:9110"}'
        values: '1x30'
      - series: 'mars_host_cpus{job="mars", instance="h2:9110", station="fleet"}'
        values: '2x30'
      - series: 'mars_host_cpu_busy_seconds_total{job="mars", instance="h2:9110", station="fleet"}'
        values: '0+0.4x30'
      - series: 'mars_host_memory_total_bytes{job="mars", instance="h2:9110", station="fleet"}'
        values: '4000x30'
      - series: 'mars_host_memory_available_bytes{job="mars", instance="h2:9110", station="fleet"}'
        values: '1000x30'
      - series: 'mars_host_filesystem_used_bytes{job="mars", instance="h2:9110", station="fleet"}'
        values: '90x30'
      - series: 'mars_host_filesystem_avail_bytes{job="mars", instance="h2:9110", station="fleet"}'
        values: '10x30'
      - series: 'mars_host_runqueue_wait_seconds_total{job="mars", instance="h2:9110", station="fleet"}'
        values: '0+1.5x30'
      - series: 'mars_host_timeslices_total{job="mars", instance="h2:9110", station="fleet"}'
        values: '0+512x30'
      - series: 'mars_host_network_packets_total{job="mars", instance="h2:9110", station="fleet", direction="rx"}'
        values: '0+30x30'
      - series: 'mars_host_network_packets_total{job="mars", instance="h2:9110", station="fleet", direction="tx"}'
        values: '0+20x30'
      - series: 'mars_host_memory_stall_seconds_total{job="mars", instance="h2:9110", station="fleet"}'
        values: '0+0.0625x90'
      - series: 'mars_info{job="mars", instance="svc:8000", station="svc", version="0.1.0"}'
        values: '1x30'
      - series: 'up{job="mars", instance="svc:8000"}'
        values: '1x30'
      - series: 'mars_process_cpu_seconds_total{job="mars", instance="svc:8000", station="svc"}'
        values: '0+0.25x30'
      - series: 'mars_http_request_duration_seconds_count{job="mars", instance="svc:8000", station="svc", route="/", method="GET", code_class="2xx", region="unknown"}'
        values: '0+4x30'
    promql_expr_test:
      - expr: mars:node_up
        eval_time: 20s
        exp_samples:
          - labels: 'mars:node_up{station="fleet", instance="h1:9110"}'
            value: 1
          - labels: 'mars:node_up{station="fleet", instance="h2:9110"}'
            value: 1
          - labels: 'mars:node_up{station="svc", instance="svc:8000"}'
            value: 1
      - expr: mars:node_load_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:node_load_ratio{station="fleet", instance="h1:9110"}'
            value: 0.5
          - labels: 'mars:node_load_ratio{station="fleet", instance="h2:9110"}'
            value: 0.9
          - labels: 'mars:node_load_ratio{station="svc", instance="svc:8000"}'
            value: 0.25
      - expr: mars:node_latency_p50_ms{station="fleet"}
        eval_time: 20s
        exp_samples:
          - labels: 'mars:node_latency_p50_ms{station="fleet", instance="h1:9110"}'
            value: 0.48828125
          - labels: 'mars:node_latency_p50_ms{station="fleet", instance="h2:9110"}'
            value: 2.9296875
      - expr: mars:latency_p50_ms{station="fleet"}
        eval_time: 20s
        exp_samples:
          - labels: 'mars:latency_p50_ms{station="fleet"}'
            value: 1.3020833333333333
      - expr: mars:throughput_rps
        eval_time: 20s
        exp_samples:
          - labels: 'mars:throughput_rps{station="fleet"}'
            value: 200
          - labels: 'mars:throughput_rps{station="svc"}'
            value: 4
      - expr: mars:error_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:error_ratio{station="fleet"}'
            value: 0.09375
          - labels: 'mars:error_ratio{station="svc"}'
            value: 0
      - expr: mars:error_ratio:rate1m{station="fleet"}
        eval_time: 80s
        exp_samples:
          - labels: 'mars:error_ratio:rate1m{station="fleet"}'
            value: 0.09375
      - expr: mars:saturation_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:saturation_ratio{station="fleet"}'
            value: 0.9
          - labels: 'mars:saturation_ratio{station="svc"}'
            value: 0.25

  # A host without PSI or schedstat: load and throughput still record, latency and errors are
  # absent (the display shows NO DATA for latency rather than a calm host).
  - name: host without psi or schedstat
    interval: 1s
    input_series:
      - series: 'mars_host_cpus{job="mars", instance="old:9110", station="old"}'
        values: '1x30'
      - series: 'mars_host_cpu_busy_seconds_total{job="mars", instance="old:9110", station="old"}'
        values: '0+0.5x30'
      - series: 'mars_host_network_packets_total{job="mars", instance="old:9110", station="old", direction="rx"}'
        values: '0x30'
    promql_expr_test:
      - expr: mars:saturation_ratio
        eval_time: 20s
        exp_samples:
          - labels: 'mars:saturation_ratio{station="old"}'
            value: 0.5
      - expr: mars:throughput_rps
        eval_time: 20s
