[project]
name = "mars-probe"
dynamic = ["version"]
description = "Prometheus instrumentation for FastAPI/Starlette apps, shaped for the MARS display"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "prometheus-client>=0.20",
    "starlette>=0.37",
]

[project.optional-dependencies]
# GeoIP region lookup: RegionConfig(geoip="GeoLite2-Country.mmdb").
geo = ["geoip2>=4.8"]
dev = [
    "fastapi",
    # starlette.testclient uses httpx2 from 1.10 on (plain httpx is deprecated there). The
    # runtime minimum stays at 0.37; only the test environment needs the newer Starlette.
    "httpx2",
    "pytest",
    "ruff",
    "starlette>=1.10",
]

[project.urls]
Homepage = "https://github.com/p-sodmann/data_shaders"
Source = "https://github.com/p-sodmann/data_shaders/tree/main/probe"
Changelog = "https://github.com/p-sodmann/data_shaders/blob/main/CHANGELOG.md"

[project.scripts]
mars-probe = "mars_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mars_probe/_version.py"

[tool.hatch.build.targets.wheel]
# Everything under the package ships, including prometheus/mars.rules.yml (`mars-probe rules`).
packages = ["src/mars_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: timing benchmarks (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
