[project]
name = "mars-probe"
dynamic = ["version"]
description = "Prometheus instrumentation for FastAPI/Starlette apps, shaped for the MARS display"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.20",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "fastapi",
    "httpx",
    "pytest",
    "ruff",
]

[project.scripts]
mars-probe = "mars_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mars_probe/_version.py"

[tool.hatch.build.targets.wheel]
# Everything under the package ships, including prometheus/mars.rules.yml (`mars-probe rules`).
packages = ["src/mars_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: timing benchmarks (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
